name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The repository mirrors to public GitHub: every push re-scans the whole history,
  # and the image jobs below refuse to publish until this passes.
  secrets:
    name: No secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release binary rather than the container image: git inside a container
      # refuses a checkout owned by another user ("dubious ownership").
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: gitleaks over the full history
        run: gitleaks git --no-banner --redact=100 .

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The server image decodes HEIC with libheif's heif-dec; installing it here lets
      # the real-decoder test run instead of skipping.
      - name: Install the HEIC decoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265

      # The test profile carries its own JWT and encryption keys, so no repository
      # secrets are needed (an empty secret would override those defaults with "").
      - name: Build and test
        run: ./mvnw verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  publish-docker:
    needs: [build-and-test, secrets]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 for the Raspberry Pi, amd64 for a server; the Maven output is
      # architecture-independent so only the base layers differ.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Build the amd64 variant locally first and inspect it: no secret files, no
      # secret environment, no secret strings. Only then build for both platforms
      # and push (the cache makes the second build cheap).
      - name: Build amd64 image for inspection
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: inspect:ci
          cache-from: type=gha
      - name: Check the image carries no secrets
        run: scripts/check-image.sh inspect:ci /app
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
