spring:
  application:
    name: family-hub-api

  profiles:
    active: dev

  jpa:
    # SQL logging controlled by logback-spring.xml per profile
    hibernate:
      ddl-auto: update
    open-in-view: false

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  issuer: family-hub-api

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google/callback}
    frontend-redirect-url: ${GOOGLE_FRONTEND_REDIRECT:http://localhost:5173/settings?googleConnected=true}

security:
  # Must be a Base64-encoded 32-byte key for AES-256
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY}

# Followed teams' games and live scores (see SportsProperties for every setting).
sports:
  mlb-base-url: ${SPORTS_MLB_BASE_URL:https://statsapi.mlb.com}
  live-poll-interval: ${SPORTS_LIVE_POLL_INTERVAL:PT30S}
  schedule-cron: ${SPORTS_SCHEDULE_CRON:0 30 4 * * *}

# Where screensaver photos are stored. A family picks its folder in the app, but only
# under these roots: the folders mounted into the container for photos.
photos:
  roots: ${PHOTO_STORAGE_ROOTS:/photos}
  default-folder: ${PHOTO_DEFAULT_FOLDER:/photos/library}
  # Shrunk copies of folder photos; blank keeps them in a hidden .cache in the photo folder.
  cache-folder: ${PHOTO_CACHE_FOLDER:}
  # libheif's decoder, installed in the image; "-" skips HEIC photos instead.
  heic-decoder: ${PHOTO_HEIC_DECODER:heif-dec}

# The family inbox: a Gmail address the family sends photos, flyers and recipes to.
# Off until the address, its app password and the family's username are all set.
inbox:
  username: ${INBOX_IMAP_USER:}
  password: ${INBOX_IMAP_PASSWORD:}
  family-username: ${INBOX_FAMILY:}
  poll-interval: ${INBOX_POLL_INTERVAL:PT2M}
  # Reading flyers and recipes needs the Claude gateway (claude-gateway/); without it
  # only emailed photos are taken.
  reader-url: ${INBOX_READER_URL:}

